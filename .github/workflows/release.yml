name: build & release

# push to main / PR  -> build every platform, run --selftest, upload a
#                       release-bundle artifact (validation only, no release)
# push tag v*         -> same, then publish a GitHub Release with the zip,
#                       all helper + ffmpeg binaries, sha256sums.txt and repo.xml
#
# LMS repo URL (always the newest release):
#   https://github.com/applemusic-lms/applemusic-lms/releases/latest/download/repo.xml

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PY: "3.12"
  # portable CPython (shared libpython, targets glibc 2.17) - PyInstaller can't
  # use manylinux's own static python. pinned for reproducibility.
  PBS_TAG: "20260901"
  PBS_VER: "3.12.14"

jobs:
  # ---------------------------------------------------------------- helper linux
  # Spotty ships musl-static Rust binaries (no libc dep at all). We can't do
  # that with a frozen CPython, so we do the Python-world equivalent: build in
  # manylinux2014 (CentOS 7, glibc 2.17) + python-build-standalone (a shared
  # libpython, also 2.17). Result: the whole bundle needs only GLIBC_2.17, so
  # it runs on any Linux from the last decade.
  #
  # checkout + setver run on the runner (modern node); only the compile runs
  # in the ancient container, via `docker run` - so node-in-CentOS-7 is a
  # non-issue.
  helper-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     platform: x86_64-linux,  arch: x86_64,  image: quay.io/pypa/manylinux2014_x86_64 }
          - { runner: ubuntu-24.04-arm, platform: aarch64-linux, arch: aarch64, image: quay.io/pypa/manylinux2014_aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setver
      - name: build (manylinux2014 + python-build-standalone)
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            -e PBS_TAG -e PBS_VER \
            "${{ matrix.image }}" \
            bash scripts/build-helper-linux.sh "${{ matrix.arch }}"
          mkdir -p out && cp dist/applemusic-helper "out/applemusic-helper-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.platform }}
          path: out/*

  # ---------------------------------------------------------------- helper armv7
  # 32-bit ARM via QEMU - flaky, so non-blocking (64-bit Pis use aarch64-linux).
  helper-armv7:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setver
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          dockerRunArgs: --volume "${{ github.workspace }}:/work"
          install: |
            apt-get update -q
            apt-get install -qy python3 python3-pip python3-venv binutils
          run: |
            cd /work
            python3 -m pip install --break-system-packages -U pip pyinstaller
            python3 -m pip install --break-system-packages -r helper/requirements.txt ./helper
            pyinstaller --onefile --name applemusic-helper --console \
              --collect-all pywidevine --collect-submodules aiohttp \
              --collect-data applemusic_helper helper/pyinstaller_entry.py
            ./dist/applemusic-helper --selftest
            mkdir -p out && cp dist/applemusic-helper out/applemusic-helper-arm-linux
      - uses: actions/upload-artifact@v4
        with: { name: helper-arm-linux, path: out/* }

  # ---------------------------------------------------------------- helper macos
  helper-macos:
    runs-on: macos-14           # Apple Silicon; Intel omitted (runner queues)
    continue-on-error: true     # non-blocking (unsigned binary anyway)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setver
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: build + selftest
        run: |
          python -m pip install -U pip pyinstaller
          python -m pip install -r helper/requirements.txt ./helper
          pyinstaller --onefile --name applemusic-helper --console \
            --collect-all pywidevine --collect-submodules aiohttp \
            --collect-data applemusic_helper helper/pyinstaller_entry.py
          ./dist/applemusic-helper --selftest
          mkdir -p out && cp dist/applemusic-helper out/applemusic-helper-darwin-arm64
      - uses: actions/upload-artifact@v4
        with: { name: helper-darwin-arm64, path: out/* }

  # ---------------------------------------------------------------- helper windows
  helper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setver
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: build + selftest
        shell: bash
        run: |
          python -m pip install -U pip pyinstaller
          python -m pip install -r helper/requirements.txt ./helper
          pyinstaller --onefile --name applemusic-helper --console \
            --collect-all pywidevine --collect-submodules aiohttp \
            --collect-data applemusic_helper helper/pyinstaller_entry.py
          dist/applemusic-helper.exe --selftest
          mkdir -p out && cp dist/applemusic-helper.exe out/applemusic-helper-win-x64.exe
      - uses: actions/upload-artifact@v4
        with: { name: helper-win-x64, path: out/* }

  # ------------------------------------------------------------------ ffmpeg
  ffmpeg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/repackage-ffmpeg.sh out
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg, path: out/* }

  # ------------------------------------------------------------------ assemble
  assemble:
    needs: [helper-linux, helper-armv7, helper-macos, helper-windows, ffmpeg]
    # required: linux + windows + ffmpeg. macOS and armv7 are best-effort.
    if: >-
      ${{ always()
          && needs.helper-linux.result == 'success'
          && needs.helper-windows.result == 'success'
          && needs.ffmpeg.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # only used by the release step (tags only)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setver
        id: ver
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: build bundle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'applemusic-helper-*' -o -name 'ffmpeg-*.tar.gz' \) \
            -exec cp {} dist/ \;
          ( cd plugin/Plugins && zip -qr "../../dist/AppleMusic-${VERSION}.zip" AppleMusic )
          bash scripts/gen-repo-xml.sh "${VERSION}" "${{ github.repository }}" > dist/repo.xml
          ( cd dist && sha256sum -- AppleMusic-*.zip applemusic-helper-* ffmpeg-*.tar.gz repo.xml \
              > sha256sums.txt )
          echo "--- release contents ---"; ls -la dist
          echo "--- repo.xml ---"; cat dist/repo.xml

      - uses: actions/upload-artifact@v4
        with: { name: release-bundle, path: dist/* }

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
